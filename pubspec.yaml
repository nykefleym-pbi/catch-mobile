name: catch_mobile
description: "Cat-ch — discover, befriend, and care for real cats around the world."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localization (Tagalog-first) — provides Material/Cupertino localized strings
  # (GlobalMaterialLocalizations etc.) for the supported locales. App copy lives
  # in lib/l10n/app_localizations.dart. SDK-pinned, so no version to manage.
  flutter_localizations:
    sdk: flutter

  # Typography — Fredoka (display) + Nunito Sans (body), per the Cat-ch design.
  google_fonts: ^6.2.1

  # State management (ADR 0002)
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Backend (Supabase)
  supabase_flutter: ^2.5.6

  # Crash reporting (ADR 0002)
  # 9.x targets modern Kotlin; 8.x pins Kotlin lang v1.6 which fails to compile
  # against current Flutter stable's Kotlin 2.x toolchain.
  sentry_flutter: ^9.0.0

  # Runtime permissions (camera, location)
  permission_handler: ^11.3.1

  # --- Phase 1: capture -> CatDex loop ---
  camera: ^0.11.0                      # in-game camera
  google_mlkit_image_labeling: ^0.13.0 # on-device "is this a real cat?" gate

  # --- Explore map ---
  # OpenStreetMap tiles via flutter_map — free, no API key required (keeps the
  # free-first spirit of the Cloudflare generation choice).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1                  # "locate me" on the map

  # Sharing a companion (sprite + story) to other apps.
  share_plus: ^10.0.0

  # Remembering that the welcome + consent flow has been completed (first launch).
  shared_preferences: ^2.3.2

  # Gentle, opt-in, on-device care reminders (ADR 0005). Local notifications
  # only — no FCM, no push token, no server. Requires Android core-library
  # desugaring (patched into the generated Gradle by the APK workflow).
  flutter_local_notifications: ^18.0.1
  # Absolute-instant scheduling for while-away reminders (zonedSchedule).
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Branding generators (run in CI after the android/ folder is created — see
  # .github/workflows/android-apk.yml). Dev-only: they generate native launcher
  # icons + the launch splash from the source art in assets/branding/.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# App launcher icon — the Cat-ch cat-face badge. Generated into the native
# mipmaps by `dart run flutter_launcher_icons` (CI step); the source art is the
# 500x500 badge in assets/branding/.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF7EF"
  # Padded foreground so the cat-face badge sits inside the adaptive-icon safe
  # zone and its ears aren't clipped by the launcher's circular/squircle mask.
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# Launch splash — the Cat-ch cat-face badge on the cozy cream surface (dark on
# the night surface). Generated by `dart run flutter_native_splash:create` (CI
# step). The source is pre-padded (assets/branding/splash.png) so the badge is
# never clipped by Android 12's circular splash mask.
flutter_native_splash:
  color: "#FFF7EF"
  color_dark: "#201A16"
  image: assets/branding/splash.png
  android_12:
    image: assets/branding/splash.png
    color: "#FFF7EF"
    color_dark: "#201A16"
