name: Build Android APK

# Produces an installable debug APK you can download and sideload on an Android
# phone — no local Flutter/dev setup required. Runs on pushes to the working
# branch and can also be triggered manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/catch-product-plan-80oy18

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ platform folder is not committed; generate it here without
      # touching lib/, pubspec.yaml, or tests.
      - name: Generate Android platform folder
        run: flutter create . --org com.example --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
